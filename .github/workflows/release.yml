name: Build release zips

# On every push to main: build chrome/ + firefox/ and upload them as workflow
# artifacts, so a fresh pair of zips always exists per browser.
# On every version tag push (e.g. v0.3.0-20260928c): additionally attach the
# zips to the GitHub Release, so users can download and install without
# building anything themselves.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build chrome + firefox zips
        run: ./build.sh

      - name: Upload per-browser zips as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zips-${{ github.sha }}
          path: dist/*-chrome.zip dist/*-firefox.zip
          if-no-files-found: error

      - name: Attach zips to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
